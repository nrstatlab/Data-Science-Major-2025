# GitHub Pages configuration
#
# Pages renders this repository's Markdown through Jekyll, which differs from
# GitHub's own Markdown renderer in two ways that matter here:
#
#   1. Liquid templating runs BEFORE Markdown, including inside code fences.
#      Any literal "{{" or "{%" in a .md file would be parsed as a template tag
#      and silently swallowed. Keep the tree free of both -- check with:
#          grep -rn '{{\|{%' --include="*.md" .
#
#   2. Mermaid blocks are not rendered natively. _layouts/default.html loads
#      Mermaid and converts ```mermaid fences client-side, so the same fences
#      keep rendering on github.com too.

title: B.Sc. (Hons) Data Science — Major
description: >-
  Study material and syllabus review for the APSCHE Model Syllabus,
  effective AY 2025-26. Notes, worked examples and runnable lab code.

theme: jekyll-theme-cayman

# Match github.com's rendering of tables, fenced code and task lists.
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# Enabled by default on GitHub Pages; listed so a local `bundle exec jekyll`
# build behaves the same way.
#   relative_links     rewrites .md links to their .html counterparts
#   readme-index       serves each directory's README.md as its index
#   optional-front-matter  processes .md files that have no YAML front matter
#   titles-from-headings   uses the first H1 as the page title
#   seo-tag            provides the {% seo %} tag used by _layouts/default.html
plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

readme_index:
  enabled: true
  remove_originals: false

# Source code is published in the repository, not as web pages. The Course 4
# spreadsheet walkthroughs are Markdown and DO belong on the site, so
# labs/course-4-stats is deliberately not excluded.
exclude:
  - tools/
  - labs/course-2-c/
  - labs/course-3-python/
  - labs/course-4-stats/python/
  - labs/course-5-dbms/
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor/
